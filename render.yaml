services:
  - type: web
    name: neuroeducacion
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py ensure_superuser"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: IS_PRODUCTION
        value: "True"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Connection string de Neon (Dashboard de Neon -> Connection
      # Details -> "Pooled connection" recomendado para Render).
      # Ya viene con ?sslmode=require, no hay que tocarlo.
      - key: DATABASE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SITE_URL
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_NOTIFICATIONS_EMAIL
        sync: false
      # Solo hacen falta para crear el primer superuser (ver
      # ensure_superuser). Una vez que lo creaste, podés borrar
      # DJANGO_SUPERUSER_PASSWORD de las env vars de Render si
      # no querés dejarla cargada.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
