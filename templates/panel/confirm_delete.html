{% extends 'panel/base.html' %}

{% block title %}Confirmar{% endblock %}
{% block page_title %}Confirmar{% endblock %}

{% block panel_content %}

<div class="panel-card mx-auto max-w-md p-8 text-center">

    <p class="text-lg font-bold">{{ title }}</p>
    <p class="mt-3 text-sm text-white/50">{{ warning }}</p>

    <div class="mt-8 flex justify-center gap-3">
        <form method="post">
            {% csrf_token %}
            <button class="rounded-full bg-rose-500/15 px-6 py-3 text-sm font-bold text-rose-300 hover:bg-rose-500/25">
                Sí, eliminar
            </button>
        </form>
        {% if cancel_pk %}
            <a href="{% url cancel_url cancel_pk %}" class="rounded-full bg-white/5 px-6 py-3 text-sm font-bold text-white/60 hover:text-white">Cancelar</a>
        {% else %}
            <a href="{% url cancel_url %}" class="rounded-full bg-white/5 px-6 py-3 text-sm font-bold text-white/60 hover:text-white">Cancelar</a>
        {% endif %}
    </div>

</div>

{% endblock %}
