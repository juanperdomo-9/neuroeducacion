{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Ingresar · Panel NeuroEducación</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%234B2E83%22/><circle cx=%2250%22 cy=%2250%22 r=%2222%22 fill=%22%23E93CAC%22/></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #150F22; }
    </style>
</head>
<body class="relative flex min-h-screen items-center justify-center overflow-hidden bg-[#150F22] px-4 text-white antialiased">

    <div class="pointer-events-none absolute left-1/2 top-[-15%] h-[480px] w-[480px] -translate-x-1/2 rounded-full bg-[#E93CAC]/20 blur-3xl"></div>
    <div class="pointer-events-none absolute right-[10%] bottom-[-10%] h-72 w-72 rounded-full bg-[#4B2E83]/40 blur-3xl"></div>

    <div class="relative w-full max-w-sm">

        <div class="mb-8 flex flex-col items-center gap-3 text-center">
            <span class="flex h-14 w-14 items-center justify-center rounded-2xl text-xl font-black" style="background: linear-gradient(135deg, #4B2E83, #E93CAC);">NE</span>
            <div>
                <p class="text-xl font-extrabold">Panel de NeuroEducación</p>
                <p class="mt-1 text-sm text-white/50">Ingresá para gestionar la plataforma</p>
            </div>
        </div>

        <form method="post" class="panel-card space-y-4 p-7">
            {% csrf_token %}

            {% if error %}
            <div class="rounded-2xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-sm font-semibold text-rose-300">
                {{ error }}
            </div>
            {% endif %}

            <div>
                <label class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-white/50">Usuario</label>
                <input type="text" name="username" autofocus required
                       class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white placeholder:text-white/30 focus:border-[#E93CAC]/40 focus:outline-none focus:ring-2 focus:ring-[#E93CAC]/20">
            </div>

            <div>
                <label class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-white/50">Contraseña</label>
                <input type="password" name="password" required
                       class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white placeholder:text-white/30 focus:border-[#E93CAC]/40 focus:outline-none focus:ring-2 focus:ring-[#E93CAC]/20">
            </div>

            <button type="submit" class="w-full rounded-full px-6 py-3.5 text-sm font-bold text-white transition hover:scale-[1.01]" style="background: linear-gradient(135deg, #4B2E83, #E93CAC);">
                Ingresar
            </button>
        </form>

        <a href="{% url 'home' %}" class="mt-6 flex items-center justify-center gap-1.5 text-xs font-semibold text-white/40 transition hover:text-white/70">
            ← Volver al sitio
        </a>
    </div>

    <style>
        .panel-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1.75rem;
        }
    </style>

</body>
</html>
