<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error del servidor</title>
<style>

* {
    box-sizing: border-box;
    font-family: 'Inter', sans-serif, Arial;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FCFAFD;
    color: #4B2E83;
    text-align: center;
    padding: 24px;
}

.card {
    max-width: 480px;
}

.eyebrow {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: #6B5A8E;
    margin-bottom: 12px;
}

h1 {
    font-size: 40px;
    font-weight: 600;
    letter-spacing: -0.03em;
    margin: 0 0 20px;
}

p {
    font-size: 14px;
    line-height: 1.6;
    color: #6B5A8E;
    margin: 0 0 32px;
}

a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 52px;
    padding: 0 28px;
    border-radius: 16px;
    background: #4B2E83;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
}

a:hover {
    background: #E93CAC;
}

</style>
</head>
<body>

<div class="card">

    <p class="eyebrow">Error 500</p>

    <h1>Algo salió mal de nuestro lado</h1>

    <p>
        Ya estamos al tanto. Volvé a intentar
        en unos minutos.
    </p>

    <a href="/">Volver al inicio</a>

</div>

</body>
</html>
